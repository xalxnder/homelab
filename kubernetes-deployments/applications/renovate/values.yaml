
renovate:
  cronjob:
    schedule: "0 2 * * *"
    timeZone: "America/New_York"
    concurrencyPolicy: Forbid
    jobRestartPolicy: Never
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    jobBackoffLimit: 1

  image:
    registry: ghcr.io
    repository: renovatebot/renovate
    pullPolicy: IfNotPresent

  existingSecret: renovate-secret

  renovate:
    config: |
      {
        "platform": "github",
        "repositories": [
          "xalxnder/homelab"
        ],
        "onboarding": false,
        "requireConfig": "required",
        "hostRules": [
                  {
                    "matchHost": "https://nexus.xalab.io",
                    "allowInternal": true
                  }
          ]
      }

  env:
    LOG_LEVEL: debug

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

  serviceAccount:
    create: true
