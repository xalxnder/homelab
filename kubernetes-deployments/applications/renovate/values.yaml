
renovate:
  cronjob:
    schedule: "0 2 * * *"
    timeZone: "America/New_York"
    concurrencyPolicy: Forbid
    jobRestartPolicy: Never
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    jobBackoffLimit: 1

  image:
    registry: ghcr.io
    repository: renovatebot/renovate
    pullPolicy: IfNotPresent

  existingSecret: renovate-secret

  config: |
    {
      "platform": "github",
      "repositories": [
        "xalxnder/homelab"
      ],
      "onboarding": false,
      "requireConfig": "required"
    }

  env:
    LOG_LEVEL: info

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

  serviceAccount:
    create: true
