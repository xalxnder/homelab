
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-secret
  namespace: renovate
spec:
  refreshInterval: 1h

  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-secret-store

  target:
    name: renovate-env
    creationPolicy: Owner

  data:
    - secretKey: RENOVATE_TOKEN
      remoteRef:
        key: /renovate/RENOVATE_TOKEN

    - secretKey: RENOVATE_PLATFORM
      remoteRef:
        key: /renovate/RENOVATE_PLATFORM

    - secretKey: RENOVATE_AUTODISCOVER
      remoteRef:
        key: /renovate/RENOVATE_AUTODISCOVER

    - secretKey: RENOVATE_GIT_AUTHOR
      remoteRef:
        key: /renovate/RENOVATE_GIT_AUTHOR
