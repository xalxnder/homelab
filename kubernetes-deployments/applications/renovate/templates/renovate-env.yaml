
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-secret
  namespace: renovate
spec:
  refreshInterval: 1h

  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password

  target:
    name: renovate-secret
    creationPolicy: Owner

  data:
    - secretKey: RENOVATE_TOKEN
      remoteRef:
        key: RENOVATE_TOKEN/value

    - secretKey: RENOVATE_PLATFORM
      remoteRef:
        key: RENOVATE_PLATFORM/value

    - secretKey: RENOVATE_AUTODISCOVER
      remoteRef:
        key: RENOVATE_AUTODISCOVER/value

    - secretKey: RENOVATE_GIT_AUTHOR
      remoteRef:
        key: RENOVATE_GIT_AUTHOR/value
