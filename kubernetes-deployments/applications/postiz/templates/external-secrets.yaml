---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-password
  namespace: postiz
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: postgres-password
    creationPolicy: Owner
  data:
    - secretKey: rss-url
      remoteRef:
        key: postiz/postgres-password

