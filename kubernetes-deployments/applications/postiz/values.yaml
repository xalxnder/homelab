postiz:
  enabled: true
  global:
    fullnameOverride: postiz
  controllers:
    postiz:
      type: deployment
      strategy: RollingUpdate
      containers:
        postiz:
          resources:
            limits:
              memory: 3Gi
              cpu: 2
            requests:
              memory: 2Gi
              cpu: 250m

          env:
          - name: TEMPORAL_ADDRESS
            value: "postiz-temporal:7233"
          - name: REDIS_URL
            valueFrom:
              secretKeyRef:
                name: redis-url
                key: redis-url
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: database-url
                key: database-url
          - name: JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: jwt-secret
                key: jwt-secret
          # - name: MASTODON_CLIENT_SECRET
          #   valueFrom:
          #     secretKeyRef:
          #       name: mastodon-client-secret
          #       key: MASTODON_CLIENT_SECRET
          # - name: MASTODON_CLIENT_ID
          #   valueFrom:
          #     secretKeyRef:
          #       name: mastodon-client-id
          #       key: MASTODON_CLIENT_ID
          # - name: X_API_KEY
          #   valueFrom:
          #     secretKeyRef:
          #       name: x-api-key
          #       key: X_API_KEY
          # - name: X_API_SECRET
          #   valueFrom:
          #     secretKeyRef:
          #       name: x-api-secret
          #       key: X_API_SECRET
          # - name: X_CLIENT
          #   valueFrom:
          #     secretKeyRef:
          #       name: x-client
          #       key: X_CLIENT
          # - name: X_SECRET
          #   valueFrom:
          #     secretKeyRef:
          #       name: x-secret
          #       key: X_SECRET

          - name: FRONTEND_URL
            value: "https://postiz.xalab.io"                     # Pod/service name inside cluster
          - name: NEXT_PUBLIC_BACKEND_URL
            value: "https://postiz.xalab.io/api"          # External/public-facing backend URL
          - name: BACKEND_INTERNAL_URL
            value: "http://postiz:3000"             # Internal API URL inside cluster
          - name: STORAGE_PROVIDER
            value: "local"
          - name: UPLOAD_DIRECTORY
            value: "/uploads"
          - name: NEXT_PUBLIC_UPLOAD_DIRECTORY
            value: "/uploads"
          - name: MASTODON_URL
            value: "https://mastodon.social"
          - name: MAIN_URL
            value: "https://postiz.xalab.io"
          - name: IS_GENERAL
            value: "true"
          - name: EMAIL_PROVIDER
            value: nodemailer
          - name: EMAIL_FROM_NAME
            value: Postiz
          - name: EMAIL_FROM_ADDRESS
            value: "postiz-mail@xalab.io"
          - name: EMAIL_HOST
            value: "smtp.mailgun.org" # smtp host if you choose nodemailer
          - name: EMAIL_PORT
            value: "587" # smtp port if you choose nodemailer
          - name: EMAIL_SECURE
            value: "true" # smtp secure if you choose nodemailer
          - name: EMAIL_USER
            valueFrom:
              secretKeyRef:
                name: email-user
                key: user
          - name: EMAIL_PASS
            valueFrom:
              secretKeyRef:
                name: email-password
                key: password

          image:
            repository: ghcr.io/gitroomhq/postiz-app
            tag: v2.12.1
            pullPolicy: IfNotPresent
    redis:
      type: deployment
      replicas: 1
      strategy: RollingUpdate
      containers:
        redis:
          command: ["redis-server", "--appendonly", "yes", "--requirepass", "$(REDIS_PASSWORD)"]
          image:
            repository: redis
            tag: "8.4.0"
            pullPolicy: IfNotPresent
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-password
                  key: redis-password

    postgresql:
      type: deployment
      replicas: 1
      strategy: RollingUpdate
      containers:
        postgresql:
          image:
            repository: postgres
            tag: "18.1"
            pullPolicy: IfNotPresent
          env:
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: postgres-password
                key: postgres-password
          - name: POSTGRES_USER
            value: "postiz"
          - name: POSTGRES_DB
            value: "postiz"
          # ADD THIS
          - name: PGDATA
            value: "/var/lib/postgresql/data/pgdata"

    temporal:
      type: deployment
      replicas: 1
      strategy: Recreate
      containers:
        temporal:
          image:
            repository: temporalio/auto-setup
            tag: "1.28.1"
            pullPolicy: IfNotPresent
          env:
          # postgres12 is Temporal's SQL driver name, not the PostgreSQL image version.
          - name: DB
            value: "postgres12"
          - name: DB_PORT
            value: "5432"
          - name: POSTGRES_SEEDS
            value: "postiz-postgresql"
          - name: POSTGRES_USER
            value: "postiz"
          - name: POSTGRES_PWD
            valueFrom:
              secretKeyRef:
                name: postgres-password
                key: postgres-password
          # Auto-setup creates separate databases on the existing persistent PostgreSQL server.
          - name: DBNAME
            value: "temporal"
          - name: VISIBILITY_DBNAME
            value: "temporal_visibility"
          - name: ENABLE_ES
            value: "false"
          - name: DEFAULT_NAMESPACE
            value: "default"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          probes:
            readiness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 7233
                periodSeconds: 10
                timeoutSeconds: 2

  persistence:
    uploads:
      enabled: true
      type: persistentVolumeClaim
      size: 2Gi
      accessMode: ReadWriteOnce
      storageClass: longhorn
      advancedMounts:
        postiz:        # controller name
          postiz:      # container name
            - path: /uploads
              readOnly: false
    database:
      enabled: true
      type: persistentVolumeClaim
      size: 2Gi
      accessMode: ReadWriteOnce
      storageClass: longhorn
      advancedMounts:
        postgresql:        # controller name
          postgresql:      # container name
            - path: /var/lib/postgresql/data
              readOnly: false
      retain: true


  service:
    temporal:
      controller: temporal
      type: ClusterIP
      ports:
        grpc:
          port: 7233
    postiz:
      controller: postiz
      ports:
        http:
          port: 5000
    postgresql:
      controller: postgresql
      type: ClusterIP
      ports:
        http:
          port: 5432
    redis:
      controller: redis
      type: ClusterIP
      ports:
        http:
          port: 6379


  ingress:
    postiz:
      className: "traefik"
      annotations:
        kubernetes.io/ingress.class: traefik
        cert-manager.io/cluster-issuer: lets-encrypt-production
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
      hosts:
        - host: "postiz.xalab.io"
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: postiz
                port: 5000
      tls:
        - hosts:
            - postiz.xalab.io
          secretName: tls-secret
