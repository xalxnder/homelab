
nexus:
  properties:
    - nexus.auth.ratelimit.enabled=false
  image:
    # -- Image repository for the default container.
    repository: docker.io/sonatype/nexus3
    # -- (string) Image tag for the default container, this will default to `.Chart.AppVersion` if not set and will be omitted if set to `-`.

  bashImage:
    # -- Image repository for bash containers.
    repository: cgr.dev/chainguard/bash
    # -- Image tag for bash containers, this will be omitted if set to `-`.
    tag: latest
    # -- (string) Optional image digest for the bash containers.
    digest:
    # -- Image pull policy for bash containers.
    pullPolicy: IfNotPresent

  jdkImage:
    # -- Image repository for the JDK container.
    repository: docker.io/eclipse-temurin
    # -- Image tag for the JDK container, this will be omitted if set to `-`.
    tag: 21-jdk
    # -- (string) Optional image digest for the JDK container.
    digest:
    # -- Image pull policy for the JDK container.
    pullPolicy: IfNotPresent

  # -- Image pull secrets.
  imagePullSecrets: []

  # -- (string) Override the name of the chart.
  nameOverride:

  # -- (string) Override the full name of the chart.
  fullnameOverride:

  # -- Labels to add to all chart resources.
  commonLabels: {}

  service:
    # -- Service type.
    type: ClusterIP
    # -- Service annotations.
    annotations: {}
    # -- Default port.
    port: 8081
    # -- Additional ports to expose.
    # @default -- See _values.yaml_
    additionalPorts:
      - port: 8082
        name: docker-proxy
        containerPort: 8082
      
    #   - port: 8083
    #     name: docker-hosted
    #     containerPort: 8083
    #     hosts:
    #       - nexus-docker-hosted-1.local
    #       - nexus-docker-hosted-2.local

  ingress:
    enabled: true
    annotations:
      kubernetes.io/ingress.class: traefik
      cert-manager.io/cluster-issuer: lets-encrypt-production
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    ingressClassName: "traefik"
    hosts: 
      - nexus.xalab.io
    path: /
    pathType: Prefix
    tls:
      - secretName: tls-secret
        hosts:
          - nexus.xalab.io


  # -- Number of replicas to create; modifying this requires the license to be configured.
  replicas: 1

  persistence:
    # -- If `true`, persistence should be enabled for the `StatefulSet`.
    enabled: true
    # -- Annotations for the `PersistentVolumeClaim`.
    annotations: {}
    # -- Access mode for the `PersistentVolumeClaim`.
    accessMode: ReadWriteOnce
    # -- Storage class for the `PersistentVolumeClaim`, if not set the default will be used.
    storageClass:
    # -- Size of the `PersistentVolumeClaim`.
    size: 8Gi
    # -- If `true`, keep `PersistentVolumeClaims` when the `StatefulSet` is deleted.
    retainDeleted: true
    # -- If `true`, keep `PersistentVolumeClaim` when the `StatefulSet` is scaled down.
    retainScaled: true
  # -- Resources for the default container.
  resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  #   limits:
  #     cpu: 100m
  #     memory: 128Mi
  #   requests:
  #     cpu: 100m
  #     memory: 128Mi

 
  metrics:
    # -- If `true`, enable metrics.
    enabled: false
    serviceMonitor:
      # -- If `true`, create a `ServiceMonitor` resource to support the _Prometheus Operator_.
      enabled: false
      # -- Additional labels for the `ServiceMonitor`.
      additionalLabels: {}
      # -- Additional endpoint configuration for the `ServiceMonitor`.
      endpointConfig: {}


  logback:
    # -- Maximum history for log files.
    maxHistory: 14

  tailLogs:
    # -- Resources for the log tailing containers.
    resources: {}

  # -- Env configuration for the _Nexus3_ container.
  install4jAddVmParams: -Xms1024m -Xmx1024m -XX:MaxDirectMemorySize=2048m

  
  # -- List of plugins to install.
  plugins: []
  #   - name: nexus-repository-composer
  #     url: https://repo1.maven.org/maven2/org/sonatype/nexus/plugins/nexus-repository-composer/0.0.29/nexus-repository-composer-0.0.29-bundle.kar

  # -- If `true`, the _chown-data-dir_ init container will be enabled, this should not be required for most CSI drivers but is left in for backwards compatibility. For new chart installs this should be set to `false`.
  chownDataDir: true

  rootPassword:
    secret: nexus-password
    key: password

  config:
    # -- If `true` & `rootPassword.secret` is set, enable the configuration Job.
    enabled: true
    job:
      image:
        # -- Image repository for the config container.
        repository: docker.io/alpine/k8s
        # -- Image tag for config container, this will be omitted if set to `-`.
        tag: 1.31.2
        # -- (string) Optional image digest for the config container.
        digest:
        # -- Image pull policy for config container.
        pullPolicy: IfNotPresent
      # -- The number of seconds to keep the config job after it's finished.
      ttlSecondsAfterFinished: 600
      # -- Node labels to match for scheduling the config job.
      nodeSelector: {}
      # -- Affinity settings for scheduling the config job.
      affinity: {}
      # -- Node taints which will be tolerated for scheduling the config job.
      tolerations: []
      # -- Annotations to apply to the config job.
      annotations: {}
      # -- Labels to add to the config job pod.
      podLabels: {}
      # -- Security context for the pod.
      podSecurityContext:
        runAsNonRoot: false
        fsGroup: 200
        seccompProfile:
          type: RuntimeDefault
      # -- Security context for the config container containers.
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        capabilities:
          drop:
            - ALL
      # -- Resources for the config container.
      resources: {}

    anonymous:
      # -- If `true`, enable anonymous access.
      enabled: true
      # -- Roles for anonymous access.
      roles:
        - nx-anonymous
        - nx-metrics
    realms:
      enabled: true
      values:
        - DockerToken
        - NexusAuthenticatingRealm

    createDefaultBlobStore: false
    # -- Blob store configuration; based on the REST API (API reference docs require an existing Nexus installation and can be found at **Administration** under _System_ → _API_).
    blobStores:
      - name: homelab
        type: file
        path: /nexus-data/blobs/homelab
        softQuota:
          type: spaceRemainingQuota
          limit: 500
    
    # -- Cleanup configuration.
    cleanup: []
    #   - name: ExampleCleanup
    #     notes: "Cleanup content that hasn't been updated in 14 days downloaded in 28 days."
    #     format: ALL_FORMATS
    #     mode: delete
    #     criteria:
    #       isPrerelease:
    #       lastBlobUpdated: "1209600"
    #       lastDownloaded: "2419200"
    #       regex:
    repos:
      # - name: docker-group
      #   format: docker
      #   type: group
      #   online: true
      #   storage:
      #     blobStoreName: homelab
      #     strictContentTypeValidation: false
      #   group:
      #     memberNames:
      #       - gcrio-proxy
      #       - docker-proxy
      #   docker:
      #     v1Enabled: false
      #     forceBasicAuth: false
      #     httpPort: 8088 
      - name: dockerhub-proxy
        format: docker
        type: proxy
        online: true
        storage:
          blobStoreName: homelab
          strictContentTypeValidation: false
        proxy:
          remoteUrl: https://registry-1.docker.io
          contentMaxAge: 1440
          metadataMaxAge: 1440
        negativeCache:
          enabled: true
          timeToLive: 1440
        httpClient:
          blocked: false
          autoBlock: true
        docker:
          v1Enabled: false
          forceBasicAuth: false
          httpPort: null
          httpsPort: null
          subdomain: null
          pathEnabled: true
        dockerProxy:
           indexType: HUB
      - name: gcrio-proxy
        format: docker
        type: proxy
        online: true
        storage:
          blobStoreName: homelab
          strictContentTypeValidation: false
        proxy:
          remoteUrl: https://gcr.io
          contentMaxAge: 1440
          metadataMaxAge: 1440
        negativeCache:
          enabled: true
          timeToLive: 1440
        httpClient:
          blocked: false
          autoBlock: true
        docker:
          v1Enabled: false
          forceBasicAuth: false
          pathEnabled: true

        dockerProxy:
           indexType: HUB
      - name: traefik-helm
        format: helm
        type: proxy
        online: true
        storage:
          blobStoreName: homelab
          strictContentTypeValidation: false
          writePolicy: allow
        proxy:
          remoteUrl: https://traefik.github.io/charts
          contentMaxAge: 1440
          metadataMaxAge: 1440
        negativeCache:
          enabled: true
          timeToLive: 1440
        httpClient:
          blocked: false
          autoBlock: true
        docker:
          v1Enabled: false
          forceBasicAuth: false
          httpPort: 8082
        dockerProxy:
           indexType: HUB
      - name: argo-helm
        format: helm
        type: proxy
        online: true
        storage:
          blobStoreName: homelab
          strictContentTypeValidation: false
          writePolicy: allow
        proxy:
          remoteUrl: https://argoproj.github.io/argo-helm
          contentMaxAge: 1440
          metadataMaxAge: 1440
        negativeCache:
          enabled: true
          timeToLive: 1440
        httpClient:
          blocked: false
          autoBlock: true
        docker:
          v1Enabled: false
          forceBasicAuth: false
          httpPort: 8082
        dockerProxy:
           indexType: HUB
      - name: rancher-helm
        format: helm
        type: proxy
        online: true
        storage:
          blobStoreName: homelab
          strictContentTypeValidation: false
          writePolicy: allow
        proxy:
          remoteUrl: https://releases.rancher.com/server-charts/stable
          contentMaxAge: 1440
          metadataMaxAge: 1440
        negativeCache:
          enabled: true
          timeToLive: 1440
        httpClient:
          blocked: false
          autoBlock: true
        docker:
          v1Enabled: false
          forceBasicAuth: false
          httpPort: 8082
        dockerProxy:
           indexType: HUB            
    # -- Privileges configuration; based on the REST API (API reference docs require an existing Nexus installation and can be found at **Administration** under _System_ → _API_).
    privileges: []
    #   - type: application
    #     name: nx-metrics-all
    #     description: All permissions for Metrics
    #     readOnly: true
    #     actions:
    #       - ALL
    #     domain: metrics
    # -- Roles configuration; based on the REST API (API reference docs require an existing Nexus installation and can be found at **Administration** under _System_ → _API_).
    roles: []
    #   - id: nexus-administrators
    #     source: default
    #     name: nexus-administrators
    #     description: LDAP Administrator Role
    #     privileges: []
    #     roles:
    #       - nx-admin
    # -- Users configuration; based on the REST API (API reference docs require an existing Nexus installation and can be found at **Administration** under _System_ → _API_).
    users: []
    #   - userId: test
    #     firstName: Test
    #     lastName: User
    #     emailAddress: test@example.org
    #     source: default
    #     status: active
    #     roles:
    #       - nx-anonymous
    #     externalRoles: []
    #     password:
    #       secret: test-user
    #       key: password
    # -- LDAP configuration; based on the REST API (API reference docs require an existing Nexus installation and can be found at **Administration** under _System_ → _API_).