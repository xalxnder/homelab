{{- $argoCD := index .Values "argo-cd" | default dict -}}
{{- if $argoCD.enabled }}
{{- $repositories := dig "configs" "repositories" dict $argoCD -}}
{{- range $key, $repository := $repositories }}
---
apiVersion: v1
kind: Secret
metadata:
  name: argocd-repo-{{ $key }}
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  name: {{ $repository.name | quote }}
  type: {{ $repository.type | quote }}
  url: {{ $repository.url | quote }}
{{- end }}
{{- end }}
