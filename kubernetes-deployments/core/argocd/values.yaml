global:
  networkPolicy:
    create: false
argo-cd:
  enabled: true
  configs:
    params:
      server.insecure: "true"
      repositories:
        rancher-proxy:
          name: rancher-proxy
          type: helm
          url: https://nexus.xalab.io/repository/rancher-helm/

        argo-proxy:
          name: argo-proxy
          type: helm
          url: https://nexus.xalab.io/repository/argo-helm/

        cert-manager-proxy:
          name: cert-manager-proxy
          type: helm
          url: https://nexus.xalab.io/repository/cert-manager-helm/

        cilium-proxy:
          name: cilium-proxy
          type: helm
          url: https://nexus.xalab.io/repository/cilium-helm/

        external-dns-proxy:
          name: external-dns-proxy
          type: helm
          url: https://nexus.xalab.io/repository/external-dns-helm/

        external-secrets-proxy:
          name: external-secrets-proxy
          type: helm
          url: https://nexus.xalab.io/repository/external-secrets-helm/

        longhorn-proxy:
          name: longhorn-proxy
          type: helm
          url: https://nexus.xalab.io/repository/longhorn-helm/

        metallb-proxy:
          name: metallb-proxy
          type: helm
          url: https://nexus.xalab.io/repository/metallb-helm/

        traefik-proxy:
          name: traefik-proxy
          type: helm
          url: https://nexus.xalab.io/repository/traefik-helm/

        victoria-metrics-proxy:
          name: victoria-metrics-proxy
          type: helm
          url: https://nexus.xalab.io/repository/vm-helm/

        metrics-server-proxy:
          name: metrics-server-proxy
          type: helm
          url: https://nexus.xalab.io/repository/metrics-server-helm/

        app-template-proxy:
          name: app-template-proxy
          type: helm
          url: https://nexus.xalab.io/repository/app-template/

  controller:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true  # Enables VictoriaMetrics/Prometheus Operator CRD discovery
  dex:
    enabled: false
  notifications:
    enabled: false
  applicationSet:
    enabled: true
    metrics:
      enabled: true
    resources:
      limits:
        cpu: 750m
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 48Mi
  server:
    metrics:
      enabled: true
      service:
        annotations:
          prometheus.io/scrape: "true"
          prometheus.io/port: "8083"
          prometheus.io/path: "/metrics"
    resources:
      limits:
        cpu: 250m
        memory: 1Gi
      requests:
        cpu: 25m
        memory: 48Mi

    # service:
    #   type: LoadBalancer
    #   ports:
    #     http:
    #       port: 80
    ingress:
      enabled: true
      ingressClassName: "traefik"
      hostname: &host argocd.xalab.io
      annotations:
        kubernetes.io/ingress.class: traefik
        cert-manager.io/cluster-issuer: lets-encrypt-production
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
      tls:
        - secretName: tls-secret
          hosts:
            - *host
      paths:
        - path: /
          pathType: Prefix
  namespaceOverride: "argocd"
argocd-apps:
  enabled: true
  applicationsets:
    core-applications:
      goTemplate: true
      generators:
        - git:
            repoURL: https://github.com/xalxnder/homelab.git
            revision: HEAD
            directories:
              - path: kubernetes-deployments/core/*
      template:
        metadata:
          name: "{{ base .path.path }}"
          labels: {}
        spec:
          project: default
          source:
            repoURL: https://github.com/xalxnder/homelab.git
            targetRevision: HEAD
            path: "{{ .path.path }}"
            helm: &appsets-helm
              valueFiles:
                - values.yaml
          destination: &appsets-destination
            server: https://kubernetes.default.svc
            namespace: '{{ if eq .path.basename "rancher" }}cattle-system{{ else }}{{ .path.basename }}{{ end }}'
          revisionHistoryLimit: 5
          syncPolicy:
            # automated:
            #   prune: true
            #   selfHeal: true
            syncOptions: &appsets-sync-options
              - ApplyOutOfSyncOnly=true
              - CreateNamespace=true
              - RespectIgnoreDifferences=true
              - PruneLast=true
          ignoreDifferences:
          - group: "apiextensions.k8s.io"
            kind: CustomResourceDefinition
            name: bgppeers.metallb.io
            jsonPointers:
            - /spec/conversion/webhook/clientConfig/caBundle
      syncPolicy:
        preserveResourcesOnDeletion: true
        applicationsSync: sync
    observability:
      goTemplate: true
      generators:
        - git:
            repoURL: https://github.com/xalxnder/homelab.git
            revision: HEAD
            directories:
              - path: kubernetes-deployments/observability/*
      template:
        metadata:
          name: "{{ base .path.path }}"
          labels: {}
        spec:
          project: default
          source:
            repoURL: https://github.com/xalxnder/homelab.git
            targetRevision: HEAD
            path: "{{ .path.path }}"
            helm: &appsets-helm
              valueFiles:
                - values.yaml
          destination: &appsets-destination
            server: https://kubernetes.default.svc
            namespace: "{{ .path.basename }}"
          revisionHistoryLimit: 5
          syncPolicy:
            # automated:
            #   prune: true
            #   selfHeal: true
            syncOptions: &appsets-sync-options
              - ApplyOutOfSyncOnly=true
              - CreateNamespace=true
              - RespectIgnoreDifferences=true
              - PruneLast=true
          ignoreDifferences: []
      syncPolicy:
        preserveResourcesOnDeletion: true
        applicationsSync: sync
    applications:
      goTemplate: true
      generators:
        - git:
            repoURL: https://github.com/xalxnder/homelab.git
            revision: HEAD
            directories:
              - path: kubernetes-deployments/applications/*
      template:
        metadata:
          name: "{{ base .path.path }}"
          labels: {}
        spec:
          project: default
          source:
            repoURL: https://github.com/xalxnder/homelab.git
            targetRevision: HEAD
            path: "{{ .path.path }}"
            helm: &appsets-helm
              valueFiles:
                - values.yaml
          destination: &appsets-destination
            server: https://kubernetes.default.svc
            namespace: '{{ if eq .path.basename "rancher" }}cattle-system{{ else }}{{ .path.basename }}{{ end }}'
          revisionHistoryLimit: 5
          syncPolicy:
            # automated:
            #   prune: true
            #   selfHeal: true
            syncOptions: &appsets-sync-options
              - ApplyOutOfSyncOnly=true
              - CreateNamespace=true
              - RespectIgnoreDifferences=true
              - PruneLast=true
          ignoreDifferences: []
      syncPolicy:
        preserveResourcesOnDeletion: true
        applicationsSync: sync
    storage:
      goTemplate: true
      generators:
        - git:
            repoURL: https://github.com/xalxnder/homelab.git
            revision: HEAD
            directories:
              - path: kubernetes-deployments/storage/*
      template:
        metadata:
          name: "{{ base .path.path }}"
          labels: {}
        spec:
          project: default
          source:
            repoURL: https://github.com/xalxnder/homelab.git
            targetRevision: HEAD
            path: "{{ .path.path }}"
            helm: &appsets-helm
              valueFiles:
                - values.yaml
          destination: &appsets-destination
            server: https://kubernetes.default.svc
            namespace: longhorn-system
          revisionHistoryLimit: 5
          syncPolicy:
            # automated:
            #   prune: true
            #   selfHeal: true
            syncOptions: &appsets-sync-options
              - ApplyOutOfSyncOnly=true
              - CreateNamespace=true
              - RespectIgnoreDifferences=true
              - PruneLast=true
          ignoreDifferences:
          - group: "apiextensions.k8s.io/v1"
            kind: CustomResourceDefinition
            name: engineimages.longhorn.io
            jsonPointers:
            - /spec/preserveUnknownFields
      syncPolicy:
        preserveResourcesOnDeletion: true
        applicationsSync: sync
