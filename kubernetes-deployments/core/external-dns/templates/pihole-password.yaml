---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pihole-password
  namespace: external-dns
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: pihole-password
    creationPolicy: Owner
  data:
    - secretKey: EXTERNAL_DNS_PIHOLE_PASSWORD
      remoteRef:
        key: FTLCONF_webserver_api_password/value
