victoria-metrics-k8s-stack:
  enabled: true
  fullnameOverride: vm-k8s-stack
  # Preserve the UIDs already stored in Grafana's persistent database.
  # Changing these breaks provisioning updates and existing dashboard references.
  defaultDatasources:
    victoriametrics:
      datasources:
        - name: VictoriaMetrics
          type: prometheus
          access: proxy
          uid: P4169E866C3094E38
          isDefault: true
        - name: VictoriaMetrics (DS)
          type: victoriametrics-metrics-datasource
          access: proxy
          uid: PA144FC3F5C193807
          isDefault: false
          plugin: true
    alertmanager:
      datasources:
        - name: Alertmanager
          access: proxy
          uid: P7647F508D5F54FCB
          jsonData:
            implementation: prometheus
  defaultRules:
    create: false
  defaultDashboards:
    enabled: true
    defaultTimezone: etc
    labels: {}
    annotations:
      argocd.argoproj.io/sync-options: ServerSideApply=true
    grafanaOperator:
      # -- Create dashboards as CRDs (requires grafana-operator to be installed)
      enabled: false
      spec:
        instanceSelector:
          matchLabels:
            dashboards: grafana
        allowCrossNamespaceImport: false
    # -- Create dashboards as ConfigMap despite dependency it requires is not installed
    dashboards:
      victoriametrics-vmalert:
        enabled: false
      victoriametrics-operator:
        enabled: true
      # -- In ArgoCD using client-side apply this dashboard reaches annotations size limit and causes k8s issues without server side apply
      # See [this issue](https://github.com/VictoriaMetrics/helm-charts/tree/disable-node-exporter-dashboard-by-default/charts/victoria-metrics-k8s-stack#metadataannotations-too-long-must-have-at-most-262144-bytes-on-dashboards)
      node-exporter-full:
        enabled: true

  victoria-metrics-operator:
    enabled: true
    admissionWebhooks:
      enabled: false

  vmsingle:
    spec:
      storage:
        resources:
          requests:
            storage: 5Gi

  grafana:
    plugins:
      - victoriametrics-metrics-datasource
    admin:
      existingSecret: "vm-grafana-secret"
      userKey: admin-user
      passwordKey: admin-password
    enabled: true
    podSecurityContext:
        fsGroup: 472
        runAsUser: 472
    sidecar:
      dashboards:
        enabled: true
        provider:
          disableDelete: false
          allowUiUpdates: true

    persistence:
      enabled: true
      type: pvc
      size: 2Gi
      accessModes:
        - ReadWriteOnce
    ingress:
      enabled: true
      annotations:
        cert-manager.io/cluster-issuer: lets-encrypt-production
        # ingress.kubernetes.io/protocol: http
        kubernetes.io/ingress.class: traefik
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
      hosts:
        - &host grafana.xalab.io
      tls:
        - hosts:
            - *host
          secretName: tls-secret
    # service:
    #   type: LoadBalancer
